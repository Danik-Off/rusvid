apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Минификация R8 на release-сборках.
 *
 * Включена: без неё три dex-файла занимали ~22 МБ — почти весь androidx,
 * media3 и OkHttp тянулись целиком, хотя приложение использует малую часть.
 * Правила keep для React Native, media3 и OkHttp приезжают из consumer-rules
 * внутри их же AAR/JAR, наши дополнения — в proguard-rules.pro.
 */
def enableProguardInReleaseBuilds = true

/**
 * ABI, ради которых вообще собирается нативный код. Значение по умолчанию —
 * из gradle.properties (там все четыре, чтобы работал эмулятор); релизный CI
 * передаёт только «телефонные»: -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
 */
def targetAbis = (project.findProperty("reactNativeArchitectures")
        ?: "armeabi-v7a,arm64-v8a").split(",").collect { it.trim() }.findAll { it }

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Версия приложения — единственный источник истины: package.json.
 *
 * Так `npm version patch` поднимает версию одновременно в npm-пакете, в APK
 * и в теге релиза, который создаёт CI (см. .github/workflows/release.yml).
 * Дублировать номер в build.gradle означало бы рано или поздно их рассинхрон.
 */
def packageJson = new groovy.json.JsonSlurper().parseText(file("../../package.json").text)
def appVersionName = packageJson.version

/**
 * versionCode обязан монотонно расти и быть целым: Android не умеет
 * сравнивать "1.10.0" и "1.9.0". Схема major*10000 + minor*100 + patch
 * даёт 1.0.0 -> 10000, 1.2.3 -> 10203 и требует minor/patch < 100.
 */
def appVersionCode = { String semver ->
    def parts = semver.tokenize('.').collect { it.replaceAll(/[^0-9].*$/, '') as int }
    if (parts.size() != 3) {
        throw new GradleException("Версия в package.json должна быть вида X.Y.Z, получено: ${semver}")
    }
    if (parts[1] > 99 || parts[2] > 99) {
        throw new GradleException("minor и patch должны быть меньше 100, получено: ${semver}")
    }
    parts[0] * 10000 + parts[1] * 100 + parts[2]
}(appVersionName)

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.rusvid"
    defaultConfig {
        applicationId "com.rusvid"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
    }

    /**
     * Один APK на каждую ABI вместо универсального.
     *
     * В универсальной сборке libreactnative.so + libhermesvm.so и вся нативка
     * лежали в четырёх экземплярах (~59 МБ из 75 МБ APK), причём x86/x86_64
     * нужны только эмулятору. Телефон всё равно распаковывает одну ABI.
     *
     * versionCode при этом общий для всех ABI: раздача идёт через GitHub
     * Releases, где APK выбирают руками, а не через Play Store, которому
     * потребовались бы разные коды.
     */
    splits {
        abi {
            enable true
            reset()
            include(*targetAbis)
            universalApk false
        }
    }

    /**
     * В APK остаются только русские и английские строки. AndroidX, media3 и
     * WebView тащат переводы на ~80 языков — приложение локализовано на два.
     */
    androidResources {
        localeFilters += ["en", "ru"]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            // Выкидывает ресурсы, на которые после минификации никто не ссылается
            // (иконки и layout'ы androidx/media3-ui, которые мы не показываем).
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        resources {
            // Метаданные сборки, которые не нужны в рантайме.
            excludes += [
                "META-INF/*.version",
                "META-INF/*.kotlin_module",
                "DebugProbesKt.bin",
                "kotlin-tooling-metadata.json",
            ]
        }
    }
}

/**
 * Кодогенерация обязана отработать ДО конфигурации CMake.
 *
 * Это не перестраховка, а починка реального молчаливого бага. Плагин React
 * Native вешает кодогенерацию только на `preBuild`, а CMake конфигурируется
 * своей задачей и может успеть раньше. Файл, которым собственный TurboModule
 * приложения попадает в сборку, —
 * `build/generated/source/codegen/jni/CMakeLists.txt` — проверяется в
 * `ReactNative-application.cmake` через `if(EXISTS …)` ровно один раз, в
 * момент конфигурации. Если его тогда не было, `libappmodules.so` для этой
 * ABI собирается БЕЗ `ScreenControl`, а конфигурация кешируется в
 * `android/app/.cxx` и сама уже не переделается.
 *
 * Ломается при этом только release на телефоне и только частично: JS видит
 * `TurboModuleRegistry.get('ScreenControl') === null`, обёртка (screenControl.ts)
 * штатно деградирует в пустышку, и полноэкранный режим тихо теряет и блокировку
 * ориентации, и скрытие системных полос — панель навигации остаётся поверх кадра.
 */
tasks.configureEach { task ->
    if (task.name.startsWith("configureCMake") || task.name.startsWith("generateJsonModel")) {
        task.dependsOn("generateCodegenArtifactsFromSchema")
    }
}

/**
 * `clean` обязан снести и кеш конфигурации CMake: без этого сборка после
 * `clean` переиспользует прежнее решение «кодогенерации нет» (см. выше).
 */
tasks.named("clean").configure {
    delete file("${projectDir}/.cxx")
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
