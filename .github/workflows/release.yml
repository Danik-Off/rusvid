name: Release

# Версия выпускается САМА, на каждый push в main с изменением кода:
#
#   1. версия считается по коммитам с последнего тега (Conventional Commits):
#      feat! / BREAKING CHANGE -> major, feat -> minor, остальное -> patch
#      (см. tools/next-version.mjs);
#   2. новая версия записывается в package.json и коммитится обратно в main —
#      оттуда её берёт android/app/build.gradle, поэтому versionName,
#      versionCode и тег не могут разъехаться;
#   3. workflow проверяет сборку, собирает release APK под arm64-v8a и
#      armeabi-v7a, ставит тег v<version> и публикует GitHub Release с APK.
#
# Проект опубликован как исходный код, а не как продукт для установки
# (см. DISCLAIMER.md, раздел 3). Проверочная сборка живёт в android.yml: она
# подтверждает, что код собирается и HLS попал в APK, но артефакт остаётся
# внутри CI и через две недели удаляется.
#
# Любой другой push в main сборку не запускает: пока версия та же, релизить
# нечего. Перевыпустить уже выпущенную версию нельзя — тег на неё стоит.
#
# Любой другой push в main сборку не запускает: пока версия та же, релизить
# нечего. Перевыпустить уже выпущенную версию нельзя — тег на неё стоит.
on:
  push:
    branches: [main]
    paths:
      # Версия живёт здесь, поэтому и триггер один. Правки package.json без
      # изменения версии (зависимости, скрипты) job «Проверить версию»
      # отсеет — до сборки дело не дойдёт.
      - package.json
  # Ручной запуск — на случай, если релиз упал на середине: версия в
  # package.json уже поднята, а тега ещё нет.
  workflow_dispatch:

permissions:
  contents: write # нужно для тега и релиза

concurrency:
  # Релизы не параллелим: два прогона подрались бы за один тег.
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Проверить версию
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужны все теги: по ним и определяется, выпускали ли уже эту версию.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: check
        run: node tools/release-version.mjs >> "$GITHUB_OUTPUT"

  release:
    name: Зафиксировать версию
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история и теги: тег ставится отсюда же.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Записать версию
        # npm version правит и package.json, и package-lock.json — поэтому
        # после npm ci, иначе ci ругнулся бы на рассинхрон.
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Проверки перед релизом
        # Релиз не должен уезжать со сломанными типами или красными тестами.
        run: |
          npm run typecheck
          npm run lint
          npm test -- --ci --reporters=default

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Компоненты SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Сборка release APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Только «телефонные» ABI: x86/x86_64 нужны эмулятору, а не тем, кто
          # ставит APK из релиза. Сборка разделена по ABI (splits в build.gradle),
          # поэтому на выходе два APK, а не один универсальный на 75 МБ.
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            --no-daemon --stacktrace

      - name: Проверить APK
        # Сборка без media3-exoplayer-hls зелёная, но видео в ней не играет —
        # проверяем артефакт, а не только конфигурацию.
        run: |
          set -euo pipefail
          out=android/app/build/outputs/apk/release

          # aapt2 лежит в build-tools и на PATH не выносится — ищем явно,
          # иначе шаг падает с «command not found» уже после часовой сборки.
          aapt2=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt2 -type f | sort | tail -n 1)
          [ -x "$aapt2" ] || { echo "::error::aapt2 не найден в build-tools"; exit 1; }

          for abi in arm64-v8a armeabi-v7a; do
            APK="$out/app-$abi-release.apk"
            [ -f "$APK" ] || { echo "::error::Не собран APK для $abi"; exit 1; }

            # classes*.dex: R8 волен разложить классы по dex-файлам как угодно,
            # HlsMediaSource$Factory сохраняется по имени consumer-правилами media3.
            #
            # grep -c, а не -q: -q закрывает поток на первом совпадении, unzip
            # получает SIGPIPE, и pipefail превращает успешную проверку в
            # падение шага. Именно на этом умирали релизы 1.0.1 и 1.1.0.
            hls=$(unzip -p "$APK" 'classes*.dex' | grep -ac 'androidx/media3/exoplayer/hls' || true)
            [ "$hls" -gt 0 ] || { echo "::error::В APK $abi нет классов ExoPlayer HLS"; exit 1; }

            version_name=$("$aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            [ "$version_name" = "$VERSION" ] \
              || { echo "::error::versionName APK $abi ($version_name) не совпал с package.json ($VERSION)"; exit 1; }

            echo "$abi: версия $version_name, $(du -h "$APK" | cut -f1), HLS-классов: $hls — проверен"
          done

      - name: Переименовать APK под версию
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            mv "android/app/build/outputs/apk/release/app-$abi-release.apk" \
               "rusvid-$VERSION-$abi.apk"
          done

      - name: Зафиксировать версию и поставить тег
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            # [skip ci] — чтобы коммит от бота не запускал прогоны по кругу.
            git commit -m "chore(release): v$VERSION [skip ci]"

            # За время прогона в main могли что-то запушить — не роняем релиз,
            # а перекладываем коммит с версией поверх.
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=true; break; fi
              echo "push отклонён (попытка $attempt) — подтягиваю main"
              git pull --rebase origin main || break
            done

            # main мог оказаться защищённым — это не повод не ставить тег.
            # Тег указывает на коммит с версией, push тега утащит и его, так что
            # следующая версия всё равно посчитается от тега, а не от package.json.
            [ "$pushed" = true ] \
              || echo "::warning::версию не удалось запушить в main (защита ветки?) — тег ставлю, package.json в main остался прежним"
          fi

          git tag -a "v$VERSION" -m "RusVid $VERSION"
          git push origin "refs/tags/v$VERSION"
          git tag -a "v$VERSION" -m "RusVid $VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: RusVid ${{ env.VERSION }}
          generate_release_notes: true
          # Файлов здесь нет намеренно: см. комментарий в шапке workflow.
          body: |
            Учебный проект, опубликованный как исходный код. Готовых сборок
            здесь нет: приложение собирается локально —
            [docs/SETUP.md](https://github.com/${{ github.repository }}/blob/main/docs/SETUP.md),
            `npm run build:apk`.

            ## Правовая информация

            Неофициальное некоммерческое приложение. Не связано с Rutube,
            VK Видео и Sasflix, не одобрено ими и не является их продуктом;
            названия платформ принадлежат их владельцам и упомянуты только для
            указания совместимости. Приложение не хранит и не раздаёт видео,
            ничего не скачивает, не снимает защиту и не обходит платный доступ.
            Поставляется «как есть», без гарантий; ответственность за
            использование — на том, кто его собрал и запустил.

            Полный текст условий — [DISCLAIMER.md](https://github.com/${{ github.repository }}/blob/main/DISCLAIMER.md).
            Обращения правообладателей и платформ — в
            [issues](https://github.com/${{ github.repository }}/issues).
