name: Android

# Сборка APK. На каждый push в main — debug (быстро, проверяет, что проект
# вообще собирается). На тег v* — release + публикация в GitHub Releases.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Вариант сборки
        type: choice
        options: [debug, release]
        default: release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: JDK 17
        # React Native 0.87 не собирается на JDK 8/11 и не проверен на 21.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Определить вариант
        id: variant
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "value=release" >> "$GITHUB_OUTPUT"
          else
            echo "value=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Проверить флаги react-native-video
        # Молчаливый killer: без RNVideo_useExoplayerHls=true сборка проходит,
        # но в APK нет media3-exoplayer-hls и не играет ни одно видео.
        run: |
          grep -q '^RNVideo_useExoplayerHls=true' android/gradle.properties \
            || { echo '::error file=android/gradle.properties::RNVideo_useExoplayerHls=true потерян — APK соберётся без поддержки HLS'; exit 1; }

      - name: Gradle assemble
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ steps.variant.outputs.value }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Проверить, что HLS попал в APK
        # Сборка «зелёная, но без HLS» уже случалась — проверяем артефакт,
        # а не только конфигурацию.
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "APK: $APK"
          unzip -p "$APK" classes.dex | grep -qa 'androidx/media3/exoplayer/hls' \
            || { echo '::error::В APK нет классов ExoPlayer HLS'; exit 1; }

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: rusvid-${{ steps.variant.outputs.value }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
