name: Android

# Проверочная сборка: подтверждает, что проект вообще собирается.
# Публикацией релизов занимается release.yml — он срабатывает на поднятие
# версии в package.json, а не на каждый push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Вариант сборки
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: JDK 17
        # React Native 0.87 не собирается на JDK 8/11 и не проверен на 21.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Компоненты SDK
        # AGP из командной строки не доустанавливает недостающие компоненты
        # сам — ставим ровно те версии, что заданы в android/build.gradle.
        # NDK и CMake нужны: react-native-screens и react-native-svg
        # компилируют C++ из исходников (в APK лежат librnscreens.so и
        # libreact_codegen_rnsvg.so).
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Проверить флаги react-native-video
        # Молчаливый killer: без RNVideo_useExoplayerHls=true сборка проходит,
        # но в APK нет media3-exoplayer-hls и не играет ни одно видео.
        run: |
          grep -q '^RNVideo_useExoplayerHls=true' android/gradle.properties \
            || { echo '::error file=android/gradle.properties::RNVideo_useExoplayerHls=true потерян — APK соберётся без поддержки HLS'; exit 1; }

      - name: Gradle assemble
        working-directory: android
        env:
          VARIANT: ${{ inputs.variant || 'debug' }}
        run: |
          chmod +x gradlew
          # Проверочной сборке хватает одной ABI: остальные собираются из тех же
          # исходников теми же тулчейнами и втрое удлиняют прогон.
          # Релиз собирает arm64-v8a + armeabi-v7a — см. release.yml.
          ARCH=-PreactNativeArchitectures=arm64-v8a
          if [ "$VARIANT" = "release" ]; then
            ./gradlew assembleRelease "$ARCH" --no-daemon --stacktrace
          else
            ./gradlew assembleDebug "$ARCH" --no-daemon --stacktrace
          fi

      - name: Проверить, что HLS попал в APK
        # Сборка «зелёная, но без HLS» уже случалась — проверяем артефакт,
        # а не только конфигурацию.
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name '*arm64-v8a*.apk' | head -n 1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          # classes*.dex, а не classes.dex: R8 в release-сборке волен разложить
          # классы по dex-файлам иначе, чем неминифицированный debug.
          unzip -p "$APK" 'classes*.dex' | grep -qa 'androidx/media3/exoplayer/hls' \
            || { echo '::error::В APK нет классов ExoPlayer HLS'; exit 1; }

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: rusvid-${{ inputs.variant || 'debug' }}-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
